name: Test on PR

on:
  pull_request:
    branches:
      - main
      - mlops
    paths:
      - 'pipeline/**'
      - 'test_package.py'
      - '.github/workflows/**'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pipeline/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd pipeline
        pip install -e .

    - name: Run package verification
      run: |
        python test_package.py

    - name: Test imports
      run: |
        python -c "from pipeline.data_preparation import DataExtractor; print('✓ DataExtractor imported')"
        python -c "from pipeline.modeling import BaselineModel; print('✓ BaselineModel imported')"
        python -c "from pipeline.evaluation import ModelEvaluator; print('✓ ModelEvaluator imported')"

  build-test:
    name: Test Build
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        cd pipeline
        python -m build

    - name: Check package
      run: |
        cd pipeline
        twine check dist/*

    - name: Test installation from wheel
      run: |
        pip install pipeline/dist/*.whl
        python -c "import pipeline; print(f'Package version: {pipeline.__version__}')"

