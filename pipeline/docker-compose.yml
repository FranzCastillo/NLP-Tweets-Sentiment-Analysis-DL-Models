version: '2.4'

services:
  pipeline:
    build: .
    container_name: nlp_data_pipeline
    volumes:
      - pipeline_data:/app/data
      - ./data_preparation:/app/data_preparation
    environment:
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true
    # Memory limits for local compose (supported in v2.4)
    mem_limit: 4g
    mem_reservation: 2g
    shm_size: 2g

volumes:
  pipeline_data: